<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>NDMA Admin</title>
<style>body{font-family:Poppins;background:#f0f7f0;padding:20px} .card{background:white;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.05);border-left:5px solid #0a3d1f} .badge{padding:3px 10px;border-radius:15px;font-size:11px;font-weight:600} .Urgent{background:#ffcdd2;color:#b71c1c} .High{background:#ffe0b2;color:#e65100} .Medium{background:#fff9c4;color:#f57f17} .Low{background:#c8e6c9;color:#1b5e20}</style>
</head><body>
<h2 style="color:#0a3d1f;">🛡️ NDMA Ticket Admin - Baringo</h2>
<p style="color:#666;font-size:13px;">All tickets sent to zani.hassan@ndma.go.ke | Total: <span id="count">0</span></p>
<div id="list"></div>
<script>
let tickets = JSON.parse(localStorage.getItem('ndma_tickets')||'[]');
document.getElementById('count').innerText = tickets.length;
document.getElementById('list').innerHTML = tickets.length ? tickets.map(t=>`
<div class="card">
<b>${t.id}</b> - ${t.date} <span class="badge ${t.priority}">${t.priority}</span><br>
<b>${t.subject}</b> - ${t.department} - ${t.location}<br>
<small>${t.name} (${t.email})</small><br><br>
${t.message}<br><br>
<button onclick="if(confirm('Delete?')){let a=JSON.parse(localStorage.getItem('ndma_tickets'));a=a.filter(x=>x.id!=='${t.id}');localStorage.setItem('ndma_tickets',JSON.stringify(a));location.reload()}" style="background:#c62828;color:white;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;">Delete</button>
</div>`).join('') : '<p>No tickets yet</p>';
</script>
</body></html>
