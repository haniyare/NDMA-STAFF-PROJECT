
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit ICT Ticket | NDMA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f7f3;
      color: #24352b;
    }
    nav {
      background: #064e32;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    nav h2 { margin: 0; }
    nav a { color: white; text-decoration: none; margin: 5px; }
    .hero {
      text-align: center;
      color: white;
      background: #08613d;
      padding: 45px 20px;
    }
    .hero h1 { margin-top: 0; font-size: 35px; }
    .ticket-card {
      max-width: 720px;
      margin: 35px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 25px #183e2412;
    }
    label { display: block; margin-top: 17px; font-weight: bold; }
    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #cbd8ce;
      border-radius: 7px;
      font: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      width: 100%;
      background: #087443;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 22px;
      cursor: pointer;
    }
    button:hover { background: #064e32; }
    #ticketStatus { line-height: 1.6; overflow-wrap: anywhere; }
    footer {
      text-align: center;
      padding: 24px;
      background: #043c27;
      color: white;
    }
    @media(max-width: 760px) {
      .ticket-card { margin: 20px 12px; padding: 22px; }
    }
  </style>
</head>
<body>
  <nav>
    <h2>NDMA ICT Support</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
      <a href="ticket.html">Submit Ticket</a>
    </div>
  </nav>

  <section class="hero">
    <h1>ICT Support Ticket</h1>
    <p>Report your technical problem so the support team can assist.</p>
  </section>

  <main class="ticket-card">
    <h2>Submit a Support Request</h2>
    <p>Please provide accurate details about the problem.</p>

    <form id="ticketForm">
      <label for="staffName">Staff Name</label>
      <input id="staffName" name="from_name" required>

      <label for="staffEmail">Email Address</label>
      <input id="staffEmail" name="reply_to" type="email" required>

      <label for="department">Department / Office</label>
      <input id="department" name="department" required>

      <label for="issueType">Type of ICT Problem</label>
      <select id="issueType" name="issue_type" required>
        <option value="">Select a problem</option>
        <option>Computer or Laptop</option>
        <option>Internet or Network</option>
        <option>Printer</option>
        <option>Email or Account Access</option>
        <option>Software Installation</option>
        <option>Other</option>
      </select>

      <label for="priority">Priority</label>
      <select id="priority" name="priority" required>
        <option value="Normal">Normal</option>
        <option value="High">High</option>
        <option value="Urgent">Urgent</option>
      </select>

      <label for="description">Describe the Problem</label>
      <textarea id="description" name="message"
        placeholder="Explain what happened and any error message..." required></textarea>

      <button type="submit" id="ticketButton">Submit Ticket</button>
      <p id="ticketStatus" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>© 2026 NDMA ICT Support | Built by Hani Hassan Yare</footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // Replace these values with your own EmailJS account details.
    const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_TICKET_TEMPLATE_ID";

    const form = document.getElementById("ticketForm");
    const status = document.getElementById("ticketStatus");
    const button = document.getElementById("ticketButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (EMAILJS_PUBLIC_KEY.startsWith("YOUR_") ||
          EMAILJS_SERVICE_ID.startsWith("YOUR_") ||
          EMAILJS_TEMPLATE_ID.startsWith("YOUR_")) {
        status.textContent =
          "Email is not configured yet. Add your EmailJS keys first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";
      status.textContent = "";

      try {
        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

        await emailjs.sendForm(
          EMAILJS_SERVICE_ID,
          EMAILJS_TEMPLATE_ID,
          form
        );

        status.textContent =
          "Your ticket has been submitted successfully. A confirmation email is not sent automatically by this form.";
        form.reset();
      } catch (error) {
        console.error(error);
        status.textContent =
          "Submission failed. Please check your EmailJS setup and try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Submit Ticket";
      }
    });
  </script>
</body>
</html>
