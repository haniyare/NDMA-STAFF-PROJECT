<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDMA Support Ticket - Baringo</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h2 { color: #0a4a7a; text-align: center; border-bottom: 3px solid #0a4a7a; padding-bottom: 10px; }
  label { font-weight: bold; margin-top: 15px; display: block; color: #333; }
  input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  textarea { height: 120px; }
  button { width: 100%; background: #0a4a7a; color: white; padding: 12px; border: none; border-radius: 5px; margin-top: 20px; font-size: 16px; cursor: pointer; }
  button:hover { background: #083a61; }
  .note { background: #e8f4ff; padding: 10px; border-left: 4px solid #0a4a7a; margin-bottom: 20px; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <h2>NDMA - Support Ticket System<br><small style="font-size:14px;">Baringo County</small></h2>
  
  <div class="note">
    This ticket will be sent directly to <b>zani.hassan@ndma.go.ke</b> without opening Chrome/Gmail.
  </div>

  <form action="https://formsubmit.co/zani.hassan@ndma.go.ke" method="POST">
    <!-- FormSubmit Settings -->
    <input type="hidden" name="_subject" value="NEW NDMA SUPPORT TICKET - Baringo">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://ndma.go.ke">
    
    <label>Full Name *</label>
    <input type="text" name="name" placeholder="Your full name" required>

    <label>Your Email *</label>
    <input type="email" name="email" placeholder="your.email@example.com" required>

    <label>Department / Office *</label>
    <select name="department" required>
      <option value="">-- Select Department --</option>
      <option value="Administration">Administration</option>
      <option value="ICT">ICT / Support</option>
      <option value="Finance">Finance</option>
      <option value="Field Operations">Field Operations</option>
      <option value="Other">Other</option>
    </select>

    <label>Priority *</label>
    <select name="priority" required>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
      <option value="Urgent">Urgent</option>
    </select>

    <label>Subject / Issue Title *</label>
    <input type="text" name="subject" placeholder="e.g. Laptop not connecting" required>

    <label>Detailed Description *</label>
    <textarea name="message" placeholder="Describe the issue in detail..." required></textarea>

    <button type="submit">Submit Ticket</button>
  </form>
</div>

</body>
</html>
