<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Hani Hassan Yare</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:linear-gradient(180deg,#052e1a 0%, #0b4a2e 35%, #f5f9f6 35%);min-height:100vh}
nav{background:white;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 20px rgba(0,0,0,0.08);position:sticky;top:0;z-index:10}
nav h2{color:#0b4a2e;font-size:18px;font-weight:800}
nav ul{display:flex;list-style:none;gap:18px}
nav ul li a{text-decoration:none;color:#222;font-weight:600}
nav ul li a.active{color:#0b4a2e;border-bottom:2px solid #0b4a2e}

.single-card{max-width:680px;margin:40px auto;background:white;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,0.2);overflow:hidden;border:1px solid #e8f5e9}

.top{background:linear-gradient(135deg,#020d06 0%, #0b4a2e 60%, #1a8a5a 100%);padding:50px 30px 35px;text-align:center;color:white}
.avatar{width:110px;height:110px;margin:0 auto;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#0b4a2e;border:4px solid #1a8a5a}
.top h1{margin-top:18px;font-size:32px;font-weight:800}
.top .role{opacity:0.9;letter-spacing:2px;font-size:12px;margin-top:6px;font-weight:600}
.top .floor{margin-top:14px;display:inline-block;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);padding:7px 18px;border-radius:30px;font-size:12px}

.body{padding:35px 30px;background:white}

.stack{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.s-item{display:flex;align-items:center;gap:15px;padding:16px 18px;border-radius:16px;text-decoration:none;border:2px solid #111;background:#111;color:white;transition:0.3s}
.s-item:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(0,0,0,0.15);background:#000}
.s-item .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:white;color:#111;font-weight:800;flex-shrink:0}
.s-item b{display:block;font-size:11px;color:#aaa;letter-spacing:0.8px}.s-item span{font-size:15px;font-weight:700;color:white}

.s-item.green{background:linear-gradient(135deg,#0b4a2e,#1a8a5a);border-color:#0b4a2e}
.s-item.green .ic{background:white;color:#0b4a2e}
.s-item.white{background:white;border-color:#111;color:#111}
.s-item.white b{color:#666}.s-item.white span{color:#111}.s-item.white .ic{background:#111;color:white}

.divider{height:1px;background:#111;opacity:0.1;margin:26px 0;position:relative}
.divider::after{content:'SEND MESSAGE TO HANI';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;padding:0 14px;font-size:10px;letter-spacing:2px;color:#111;font-weight:800;border:1px solid #111;border-radius:20px}

.field{margin-bottom:14px}
.field input,.field select,.field textarea{width:100%;padding:15px 16px;border:2px solid #111;border-radius:14px;outline:none;background:#f9fdf9;font-size:14px;color:#111;font-weight:500;transition:0.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#0b4a2e;background:white;box-shadow:0 0 0 4px rgba(11,74,46,0.12)}
.field input::placeholder,.field textarea::placeholder{color:#888}

.btn{width:100%;padding:16px;background:#111;color:white;border:2px solid #111;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;transition:0.3s;letter-spacing:0.5px}
.btn:hover{background:#0b4a2e;border-color:#0b4a2e;transform:translateY(-2px);box-shadow:0 12px 30px rgba(11,74,46,0.3)}
.btn2{display:block;text-align:center;padding:13px;border-radius:14px;text-decoration:none;font-weight:700;margin-top:10px;border:2px solid #111;transition:0.3s}
.wa{background:white;color:#111}.wa:hover{background:#111;color:white}
.li{background:#0b4a2e;color:white;border-color:#0b4a2e}.li:hover{background:#111}

.success{display:none;margin-top:16px;background:#0b4a2e;color:white;padding:14px;border-radius:12px;text-align:center;font-weight:700}
</style>
</head>
<body>
<nav><h2>NDMA ICT Helpdesk</h2><ul><li><a href="home.html">Home</a></li><li><a href="Faq.html">FAQ</a></li><li><a href="contact.html" class="active">Contact</a></li></ul></nav>

<div class="single-card">
  <div class="top">
    <div class="avatar">HHY</div>
    <h1>Hani Hassan Yare</h1>
    <div class="role">ICT SUPPORT • NDMA</div>
    <div class="floor">🏢 8th Floor - NDMA HQ, Nairobi</div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#fff; border-bottom:2px solid #0b4a2f;">
  <div id="logoTrick" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
    <img src="https://www.ndma.gov.pk/public/img/logo.png" height="35">
    <strong style="color:#0b4a2f;">NDMA ICT Helpdesk</strong>
  </div>
  <div style="display:flex; gap:18px;">
    <a href="home.html" target="_self">Home</a>
    <a href="about.html" target="_self">About</a>
    <a href="contact.html" target="_self">Contact</a>
    <a href="faq.html" target="_self">FAQ</a>
    <a href="admin.html" id="adminLink" style="display:none; color:red;">Admin</a>
  </div>
</div>

<script>
let count=0;
document.getElementById('logoTrick').onclick=()=>{
  count++;
  if(count>=3){document.getElementById('adminLink').style.display='block'; alert('Admin unlocked!'); count=0;}
  setTimeout(()=>count=0,2000);
}
</script>
if(window.location.href.includes('sent=true')){
 document.getElementById('ok').style.display='block';
}
</script>
</body>
</html>
